<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Academic Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Student Portal</h2>
        <ul>
            <li>Dashboard</li>
            <li>Attendance</li>
            <li>Results</li>
            <li>Exams</li>
            <li>Announcements</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main">

        <div class="header">
            <h1>Student Academic Dashboard</h1>
            <p>Welcome Back, Student!</p>
        </div>

        <div class="card">
            <h3>Student Details</h3>
            <p>Name: John Doe</p>
            <p>Roll No: 101</p>
            <p>Department: CSE</p>
        </div>

        <div class="card">
            <h3>Attendance</h3>
            <p>85%</p>
            <div class="progress">
                <div class="progress-bar"></div>
            </div>
        </div>

        <div class="card">
            <h3>Semester Results</h3>
            <table>
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                </tr>
                <tr>
                    <td>Mathematics</td>
                    <td>90</td>
                </tr>
                <tr>
                    <td>Programming</td>
                    <td>88</td>
                </tr>
                <tr>
                    <td>Database</td>
                    <td>85</td>
                </tr>
            </table>
        </div>

    </div>

</body>
</html>
