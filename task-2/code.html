<!DOCTYPE html>
<html>
<head>
    <title>Food Corner</title>
    <style>
        body {
            font-family: Arial;
            background: #fff3e0;
            text-align: center;
        }

        .card {
            background: white;
            width: 280px;
            margin: 30px auto;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 10px #ccc;
        }

        img {
            width: 100%;
            border-radius: 10px;
        }

        button {
            background: orange;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🍔 Food Corner</h2>
        <p>⭐ 4.5 | 🔥 20% OFF</p>

        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600"
             alt="Delicious burger">

        <h3>Burger - ₹150</h3>
        <button>Order Now</button>

        <p>💬 "Very tasty!"</p>
    </div>

</body>
</html>
